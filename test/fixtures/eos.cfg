! device: eos-leaf-1 (DCS-7050SX3-48YC12, EOS-4.28.0F)
! Synthetic EOS catalog. Not a bootable config.
!
hostname eos-leaf-1
!
aaa authentication login default group tacacs+ local
aaa root secret sha512 SEC_EOS_ROOT
username admin privilege 15 role network-admin secret sha512 SEC_EOS_USER
username ops privilege 1 secret 0 SEC_EOS_USER_PLAIN
!
snmp-server community SEC_EOS_SNMP ro
snmp-server host 10.7.7.7 version 2c SEC_EOS_SNMP_HOST
snmp-server user snmpuser version 3 auth sha SEC_EOS_SNMP_AUTH priv aes SEC_EOS_SNMP_PRIV
!
tacacs-server host 10.6.6.6 key 7 SEC_EOS_TACACS
radius-server host 10.6.6.7 key 0 SEC_EOS_RADIUS
tacacs-server key SEC_EOS_TACACS_GLOBAL
!
management api http-commands
   protocol https
   no shutdown
!
management console
   idle-timeout 30
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvcompression=gzip -cvaddr=10.5.5.5:9910 -cvauth=SEC_EOS_CVAUTH -taillogs
   no shutdown
!
vlan 20
   name SERVERS
!
interface Ethernet1
   description Leaf to spine
   no switchport
   ip address 10.1.1.1/24
   ip ospf message-digest-key 1 md5 SEC_EOS_OSPF
!
interface Ethernet2
   description Access
   switchport access vlan 20
!
router bgp 65000
   neighbor 10.2.2.2 remote-as 65001
   neighbor 10.2.2.2 password 7 SEC_EOS_BGP
   neighbor 10.2.2.2 description WAN peer
!
ntp authentication-key 1 md5 SEC_EOS_NTP
!
ip access-list BLOCK
   10 permit ip 10.20.0.0/24 any
   20 deny ip any any
!
key chain MGMT
   key 1
      key-string 7 SEC_EOS_KEYCHAIN
!
