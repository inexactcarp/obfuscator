!Command: show running-config
! Synthetic NX-OS catalog. Not a bootable config.
version 9.3(8) Bios:version 07.66
hostname nxos-leaf-1
boot nxos bootflash:/nxos.9.3.8.bin
feature bgp
feature interface-vlan
feature tacacs+
feature ospf
!
username admin password 5 SEC_NX_USER_HASH role network-admin
username ops password 0 SEC_NX_USER_PLAIN role network-operator
!
snmp-server community SEC_NX_SNMP group network-operator
snmp-server user snmpuser network-operator auth md5 SEC_NX_SNMP_AUTH priv aes-128 SEC_NX_SNMP_PRIV localizedkey
snmp-server host 10.9.9.9 traps version 2c SEC_NX_SNMP_HOST udp-port 2162
snmp-server host 10.9.9.2 version 3 priv snmpuser
!
tacacs-server host 10.8.8.8 key 7 "SEC_NX_TACACS"
radius-server host 10.8.8.9 key 0 "SEC_NX_RADIUS" auth-port 1812 acct-port 1813
tacacs-server key 7 SEC_NX_TACACS_GLOBAL
!
key chain EIGRP-CHAIN
  key 1
    key-string 7 SEC_NX_KEYCHAIN
!
interface Ethernet1/1
  description Server port
  no switchport
  ip address 10.1.1.1/24
  ip ospf authentication message-digest
  ip ospf message-digest-key 1 md5 3 SEC_NX_OSPF
!
interface Ethernet1/2
  description Access port
  switchport
  switchport access vlan 10
!
interface Ethernet1/3
  ip ospf authentication-key 3 SEC_NX_OSPF_AUTHKEY
!
vlan 10
  name SERVERS
!
ip access-list BLOCK
  10 permit ip 10.10.0.0/24 any
  20 deny ip any any
!
router bgp 65000
  router-id 10.0.0.1
  neighbor 10.2.2.2
    remote-as 65001
    description Peer in site B
    password 3 SEC_NX_BGP
!
ntp authentication-key 5 md5 SEC_NX_NTP 7
ntp server 10.7.7.7 key 5
!
line console
  password 7 SEC_NX_LINE
password strength-check
!
