!
! Synthetic IOS-XE catalog. Not a bootable config.
!
version 17.9
hostname ios-edge-1
!
boot system flash:cat9k_iosxe.bin
service password-encryption
password encryption aes
!
enable secret 0 SEC_IOS_REUSED
enable secret 4 SEC_IOS_ENABLE_4
enable secret 5 SEC_IOS_ENABLE_5_$1$Fk0U$aabbccddeeff
enable password 7 SEC_IOS_ENABLE_7
enable secret 8 SEC_IOS_ENABLE_8
enable secret 9 SEC_IOS_ENABLE_9
enable secret level 15 5 SEC_IOS_ENABLE_LEVEL
!
username admin privilege 15 secret 9 SEC_IOS_USER_SECRET
username ops password 0 SEC_IOS_USER_PLAIN
username noc privilege 1 password 7 SEC_IOS_USER_TYPE7
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
!
banner motd ^
Do not share your password.
Welcome to ios-edge-1.
^
!
vlan 100
 name USERS
!
interface GigabitEthernet0/1
 description Uplink to core - password note is not a secret
 ip address 10.1.1.1 255.255.255.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 7 SEC_IOS_OSPF_MD5
 isis authentication mode md5
 isis password SEC_IOS_ISIS
 ip rip authentication mode md5
 ip rip authentication key-chain RIP-CHAIN
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 RIP-CHAIN
!
interface GigabitEthernet0/2
 description User access
 switchport access vlan 100
!
ip access-list extended BLOCK-GUEST
 permit ip 10.100.0.0 0.0.0.255 any
 deny ip any any
!
router rip
 version 2
 network 10.0.0.0
!
router eigrp 100
 network 10.0.0.0
!
router isis
 net 49.0001.0000.0000.0001.00
 domain-password hmac-md5 SEC_IOS_ISIS_DOMAIN
!
router bgp 65000
 bgp router-id 10.1.1.1
 neighbor 192.0.2.10 remote-as 65001
 neighbor 192.0.2.10 description WAN peer
 neighbor 192.0.2.10 password 7 SEC_IOS_BGP
!
key chain RIP-CHAIN
 key 1
  key-string 7 SEC_IOS_KEYCHAIN
  cryptographic-algorithm hmac-sha-256
!
line con 0
 password 7 SEC_IOS_LINE_CON
 login
!
line vty 0 4
 password 0 SEC_IOS_REUSED
 login local
 transport input ssh
!
line aux 0
 password SEC_IOS_LINE_AUX
password encryption aes
!
snmp-server location Lab
snmp-server contact noc@example.net
snmp-server community SEC_IOS_SNMP_COMM ro
snmp-server host 10.9.9.1 version 2c SEC_IOS_SNMP_HOST
snmp-server host 10.9.9.2 version 3 priv snmpuser
snmp-server user snmpuser SNMPGROUP v3 auth sha SEC_IOS_SNMP_AUTH priv aes 128 SEC_IOS_SNMP_PRIV
!
tacacs-server host 10.8.8.1 key 7 SEC_IOS_TACACS_HOST
tacacs-server key SEC_IOS_TACACS_GLOBAL
radius-server host 10.8.8.2 auth-port 1812 acct-port 1813 key 0 SEC_IOS_RADIUS_HOST
!
radius server ISE
 address ipv4 10.8.8.3 auth-port 1812 acct-port 1813
 key 7 SEC_IOS_RADIUS_SERVER
!
aaa group server tacacs+ TACACS-GRP
 server-private 10.8.8.4 key 0 SEC_IOS_AAA_SERVER_PRIVATE
 key SEC_IOS_AAA_GROUP
!
aaa server radius dynamic-author
 client 10.8.8.5 server-key 0 SEC_IOS_DYN_AUTH
 auth-type any
!
ntp authenticate
ntp authentication-key 1 md5 SEC_IOS_NTP 7
ntp trusted-key 1
ntp server 10.7.7.1 key 1
!
crypto isakmp policy 10
 encryption aes
 authentication pre-share
 group 14
crypto isakmp key SEC_IOS_IKE_PSK address 192.0.2.50
!
crypto keyring SPOKES
 pre-shared-key address 192.0.2.40 key SEC_IOS_KEYRING
!
crypto ikev2 keyring IKE-RING
 peer HQ
  address 192.0.2.60
  pre-shared-key local SEC_IOS_IKE_LOCAL remote SEC_IOS_IKE_REMOTE
!
wlan CORP 1 CORP
 security wpa akm psk
 security wpa psk set-key ascii 0 SEC_IOS_WLAN_PSK
 no shutdown
!
dot11 ssid GUEST
 authentication open
 authentication key-management wpa version 2
 wpa-psk ascii 0 SEC_IOS_DOT11_PSK
!
dot1x credentials CREDS
 username dot1xuser
 password 0 SEC_IOS_DOT1X
!
ip ssh pubkey-chain
 username admin
  key-hash ssh-rsa 0123456789ABCDEF SSH_PUBLIC_FINGERPRINT
!
crypto key pubkey-chain rsa
 addressed-key 192.0.2.70
  key-string
   SEC_IOS_CRYPTO_BLOCK_LINE1
   SEC_IOS_CRYPTO_BLOCK_LINE2
  quit
!
-----BEGIN CERTIFICATE-----
PUBLIC_CERT_MATERIAL_SHOULD_STAY
-----END CERTIFICATE-----
!
-----BEGIN RSA PRIVATE KEY-----
SEC_IOS_PEM_LINE1
SEC_IOS_PEM_LINE2
-----END RSA PRIVATE KEY-----
!
ip cef
!
